plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT'
    id 'java'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    // Cloth Config + Mod Menu (optional, for the config screen)
    maven { name = 'Shedaniel';  url = 'https://maven.shedaniel.me/' }
    maven { name = 'TerraformersMC'; url = 'https://maven.terraformersmc.com/releases/' }
    // masa's maven historically hosts Litematica/malilib. The sakura-ryoko
    // fork may not publish here for every MC version, which is why the
    // default dependency wiring below uses local jars in ./libs instead.
    maven { name = 'masa';       url = 'https://masa.dy.fi/maven' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings   "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // ---------------------------------------------------------------
    //  Litematica + malilib.
    //  DEFAULT (most reliable): download the two 1.21.11 jars from
    //  Modrinth and drop them in ./libs . They are compile-only; you run
    //  the game with them installed as normal mods.
    //     https://modrinth.com/mod/litematica/versions  (1.21.11)
    //     https://modrinth.com/mod/malilib/versions      (1.21.11)
    // ---------------------------------------------------------------
    fileTree(dir: 'libs', include: ['*.jar']).each { jar ->
        modCompileOnly files(jar)
        // Uncomment the next line to ALSO launch the dev client with them:
        // modLocalRuntime files(jar)
    }

    // ALTERNATIVE (if the fork publishes to a maven for 1.21.11), comment
    // out the fileTree block above and use coordinates instead, e.g.:
    // modCompileOnly "fi.dy.masa.litematica:litematica-fabric-${project.minecraft_version}:${project.litematica_version}"
    // modCompileOnly "fi.dy.masa.malilib:malilib-fabric-${project.minecraft_version}:${project.malilib_version}"

    // Config GUI (optional). The mod runs fine without these; the config
    // screen entrypoint is only registered when Mod Menu is present.
    modApi("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

jar {
    from("LICENSE") { rename { "${it}_${project.archives_base_name}" } }
}
