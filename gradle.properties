# =====================================================================
#  HumanBuilder - gradle.properties
#  Minecraft 1.21.11 / Fabric
# ---------------------------------------------------------------------
#  VERIFY these three lines against the current metadata before your
#  first build (they move often). Everything else is stable.
#    * yarn_mappings  -> https://fabricmc.net/develop/  (pick 1.21.11)
#    * loader_version -> https://fabricmc.net/develop/
#    * fabric_version -> https://modrinth.com/mod/fabric-api/versions (1.21.11)
# =====================================================================
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# --- Fabric / Minecraft ---
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.1
loader_version=0.16.14
fabric_version=0.116.0+1.21.11

# --- Mod metadata ---
mod_version=1.0.0
maven_group=com.humanbuilder
archives_base_name=humanbuilder

# --- Optional dep versions (only used if you switch to the Maven blocks
#     in build.gradle instead of the libs/ folder approach). ---
litematica_version=0.26.11
malilib_version=0.26.11
cloth_config_version=15.0.140
modmenu_version=11.0.3
