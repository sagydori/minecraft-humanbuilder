name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Resolve versions and download mod dependencies
        run: |
          set -euo pipefail
          MC=1.21.11

          echo "== Resolving Fabric metadata for $MC =="
          YARN=$(curl -s "https://meta.fabricmc.net/v2/versions/yarn/$MC" | jq -r '.[0].version // empty')
          LOADER=$(curl -s "https://meta.fabricmc.net/v2/versions/loader" | jq -r '[.[] | select(.stable==true)][0].version')
          FAPI=$(curl -sG "https://api.modrinth.com/v2/project/fabric-api/version" \
                   --data-urlencode "game_versions=[\"$MC\"]" \
                   --data-urlencode "loaders=[\"fabric\"]" | jq -r '.[0].version_number // empty')
          echo "yarn=$YARN  loader=$LOADER  fabric-api=$FAPI"
          test -n "$YARN";  test -n "$LOADER";  test -n "$FAPI"

          sed -i "s|^yarn_mappings=.*|yarn_mappings=$YARN|"     gradle.properties
          sed -i "s|^loader_version=.*|loader_version=$LOADER|" gradle.properties
          sed -i "s|^fabric_version=.*|fabric_version=$FAPI|"   gradle.properties
          echo "== gradle.properties =="; cat gradle.properties

          mkdir -p libs
          for slug in malilib litematica; do
            echo "== Fetching $slug for $MC =="
            URL=$(curl -sG "https://api.modrinth.com/v2/project/$slug/version" \
                    --data-urlencode "game_versions=[\"$MC\"]" \
                    --data-urlencode "loaders=[\"fabric\"]" \
                    | jq -r 'sort_by(.date_published) | reverse | .[0].files[] | select(.primary==true) | .url' | head -1)
            if [ -z "$URL" ] || [ "$URL" = "null" ]; then
              echo "ERROR: no $slug build for $MC (fabric) found on Modrinth"; exit 1
            fi
            echo "  -> $URL"
            curl -sL "$URL" -o "libs/$slug.jar"
          done
          ls -la libs

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build
        run: gradle build --stacktrace --no-daemon

      - name: Upload jar (per-run artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: humanbuilder-jar
          path: build/libs/*.jar
          if-no-files-found: warn

      - name: Publish "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          MAIN_JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          echo "Releasing: $MAIN_JAR"
          gh release delete latest -y --cleanup-tag || true
          gh release create latest "$MAIN_JAR" \
            --title "Latest build" \
            --notes "Automated build from ${{ github.sha }}. Install alongside Fabric API, Litematica, and malilib for Minecraft 1.21.11." \
            --latest
